<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Manager</title>
  <meta name="description" content="Budgets, receipts, shifts, debts, goals and net worth in one place.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 21l5-6 4 4 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Finance Manager</span>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="sidebar-foot" id="aiBadge"></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <div class="month-picker" id="monthPicker">
            <button class="icon-btn" data-step="-1" aria-label="Previous month">‹</button>
            <input type="month" id="monthInput" aria-label="Month">
            <button class="icon-btn" data-step="1" aria-label="Next month">›</button>
          </div>
          <div class="add-wrap">
            <button class="btn primary" id="quickAdd" aria-haspopup="menu">+ Add</button>
            <div class="menu hidden" id="addMenu" role="menu"></div>
          </div>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">◐</button>
        </div>
      </header>
      <nav id="subnav" class="subnav hidden" aria-label="Section"></nav>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>
  <input type="file" id="globalReceipt" accept="image/*,application/pdf" multiple hidden>
  <input type="file" id="globalSchedule" accept="image/*,application/pdf,.csv,.xlsx,.xls,.ics,text/calendar" multiple hidden>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
