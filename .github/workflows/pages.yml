name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # The real app runs on Render; GitHub Pages only forwards visitors there.
      - name: Build redirect page
        run: |
          mkdir -p dist
          URL=https://monthly-expenses-maqc.onrender.com/
          printf '<!doctype html><meta charset="utf-8"><title>Finance Manager</title><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><p>Finance Manager has moved to <a href="%s">%s</a>.</p>\n' "$URL" "$URL" "$URL" "$URL" > dist/index.html
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
